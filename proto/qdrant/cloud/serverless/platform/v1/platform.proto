syntax = "proto3";

package qdrant.cloud.serverless.platform.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "qdrant/cloud/common/v1/common.proto";

// PlatformService is the API used to query for cloud regions information for the serverless spaces in the platform.
service PlatformService {
  // The API version of this service.
  option (qdrant.cloud.common.v1.api_version) = {
    major: 2
    minor: 0
    patch: 0
  };
  // Lists all cloud regions (not account-specific).
  // Authentication is not required.
  rpc ListGlobalCloudRegions(ListGlobalCloudRegionsRequest) returns (ListGlobalCloudRegionsResponse) {
    // authentication not required
    option (qdrant.cloud.common.v1.requires_authentication) = false;
    // gRPC Gateway REST call
    option (google.api.http) = {get: "/api/serverless/platform/v1/cloud-regions"};
  }
  // Gets a specific cloud region (not account-specific) identified by cloud region ID.
  // Authentication is not required.
  rpc GetGlobalCloudRegion(GetGlobalCloudRegionRequest) returns (GetGlobalCloudRegionResponse) {
    // authentication not required
    option (qdrant.cloud.common.v1.requires_authentication) = false;
    // gRPC Gateway REST call
    option (google.api.http) = {get: "/api/serverless/platform/v1/cloud-regions/{cloud_region_id}"};
    // log fields
    option (common.v1.log_fields) = {
      name: "cloud_region_id"
      field_expression: "cloud_region_id"
    };
  }
  // Lists all cloud regions in the account identified by the given ID.
  // Required permissions:
  // - None (authenticated only)
  rpc ListCloudRegions(ListCloudRegionsRequest) returns (ListCloudRegionsResponse) {
    // permissions
    option (common.v1.permissions) = "";
    // gRPC Gateway REST call
    option (google.api.http) = {get: "/api/serverless/platform/v1/accounts/{account_id}/cloud-regions"};
  }
  // Gets a specific cloud region in the account identified by the given ID.
  // Required permissions:
  // - None (authenticated only)
  rpc GetCloudRegion(GetCloudRegionRequest) returns (GetCloudRegionResponse) {
    // permissions
    option (common.v1.permissions) = "";
    // gRPC Gateway REST call
    option (google.api.http) = {get: "/api/serverless/platform/v1/accounts/{account_id}/cloud-regions/{cloud_region_id}"};
    // log fields
    option (common.v1.log_fields) = {
      name: "cloud_region_id"
      field_expression: "cloud_region_id"
    };
  }
}

// buf:lint:ignore QDRANT_CLOUD_REQUIRED_REQUEST_FIELDS
// ListGlobalCloudRegionsRequest is the request for the ListGlobalCloudRegions function.
message ListGlobalCloudRegionsRequest {
  // Empty
}

// ListGlobalCloudRegionsResponse is the response from the ListGlobalCloudRegions function.
message ListGlobalCloudRegionsResponse {
  // The cloud regions.
  repeated CloudRegion items = 1;
}

// buf:lint:ignore QDRANT_CLOUD_REQUIRED_REQUEST_FIELDS
// GetGlobalCloudRegionRequest is the request for the GetGlobalCloudRegion function.
message GetGlobalCloudRegionRequest {
  // The identifier for the cloud region.
  // This is a required field.
  string cloud_region_id = 1 [(buf.validate.field).string = {min_len: 1}];
}

// GetGlobalCloudRegionResponse is the response from the GetGlobalCloudRegion function.
message GetGlobalCloudRegionResponse {
  // The cloud region.
  CloudRegion region = 1;
}

// ListCloudRegionsRequest is the request for the ListCloudRegions function.
message ListCloudRegionsRequest {
  // The identifier of the account (in GUID format).
  // This is a required field.
  string account_id = 1 [(buf.validate.field).string = {uuid: true}];
}

// ListCloudRegionsResponse is the response from the ListCloudRegions function.
message ListCloudRegionsResponse {
  // The cloud regions.
  repeated CloudRegion items = 1;
}

// GetCloudRegionRequest is the request for the GetCloudRegion function.
message GetCloudRegionRequest {
  // The identifier of the account (in GUID format).
  // This is a required field.
  string account_id = 1 [(buf.validate.field).string = {uuid: true}];
  // The identifier for the cloud region.
  // This is a required field.
  string cloud_region_id = 2 [(buf.validate.field).string = {min_len: 1}];
}

// GetCloudRegionResponse is the response from the GetCloudRegion function.
message GetCloudRegionResponse {
  // The cloud region.
  CloudRegion region = 1;
}

// buf:lint:ignore QDRANT_CLOUD_REQUIRED_ENTITY_FIELDS
// CloudRegion represents a cloud region where serverless spaces can be hosted.
message CloudRegion {
  // The globally unique identifier for the cloud region.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // The human-readable name of the cloud region.
  // e.g. "Frankfurt", "Tokyo", etc.
  string name = 2 [(buf.validate.field).string.min_len = 1];
  // Indicates whether the cloud region is available.
  bool available = 3;
  reserved 4;
  reserved "provider";
  // ISO 3166-1 alpha-2 country codes for different countries to display for each region.
  optional string country_iso_code = 5 [(buf.validate.field).string = {
    len: 2
    pattern: "^[A-Z]{2}$"
  }];
  // Geographic location grouping of the region.
  // e.g. "Europe", "Asia", "North America", etc.
  optional string geographical_sub_region = 6 [(buf.validate.field).string.min_len = 1];
}
