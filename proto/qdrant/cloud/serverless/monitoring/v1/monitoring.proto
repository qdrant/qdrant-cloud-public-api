syntax = "proto3";

package qdrant.cloud.serverless.monitoring.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "qdrant/cloud/common/v1/common.proto";

// MonitoringService provides access to monitoring data for serverless spaces,
// such as per-collection metrics, inference token usage, and alerts.
// Unlike cluster monitoring, this service does not expose logs or events.
service MonitoringService {
  // The API version of this service.
  option (qdrant.cloud.common.v1.api_version) = {
    major: 1
    minor: 0
    patch: 0
  };
  // Gets the summary metrics of a space in the account identified by the given ID.
  // Metrics are aggregated per collection and may be paginated (a space can have many collections).
  // Required permissions:
  // - read:serverless_spaces
  rpc GetSpaceSummaryMetrics(GetSpaceSummaryMetricsRequest) returns (GetSpaceSummaryMetricsResponse) {
    // permissions
    option (common.v1.permissions) = "read:serverless_spaces";
    // gRPC Gateway REST call
    option (google.api.http) = {get: "/api/serverless/v1/accounts/{account_id}/spaces/{space_id}/summary-metrics"};
    // log fields
    option (common.v1.log_fields) = {
      name: "space_id"
      field_expression: "space_id"
    };
  }
  // Gets the detailed usage metrics (as timeseries) of a space in the account identified by the given ID.
  // Metrics are aggregated per collection and may be paginated (a space can have many collections).
  // Required permissions:
  // - read:serverless_spaces
  rpc GetSpaceUsageMetrics(GetSpaceUsageMetricsRequest) returns (GetSpaceUsageMetricsResponse) {
    // permissions
    option (common.v1.permissions) = "read:serverless_spaces";
    // gRPC Gateway REST call
    option (google.api.http) = {get: "/api/serverless/v1/accounts/{account_id}/spaces/{space_id}/usage-metrics"};
    // log fields
    option (common.v1.log_fields) = {
      name: "space_id"
      field_expression: "space_id"
    };
  }
  // Gets the inference token usage metrics for a space.
  // Metrics are aggregated per collection and may be paginated (a space can have many collections).
  // Provide `inference_model_id` to limit the response to a single model.
  // Required permissions:
  // - read:serverless_spaces
  rpc GetSpaceInferenceMetrics(GetSpaceInferenceMetricsRequest) returns (GetSpaceInferenceMetricsResponse) {
    // permissions
    option (common.v1.permissions) = "read:serverless_spaces";
    // gRPC Gateway REST call
    option (google.api.http) = {get: "/api/serverless/v1/accounts/{account_id}/spaces/{space_id}/metrics/inference"};
    // log fields
    option (common.v1.log_fields) = {
      name: "space_id"
      field_expression: "space_id"
    };
  }
  // Lists the alerts for a space in the account identified by the given ID.
  // Alerts are scoped per collection, sorted by last_firing_at (most recent first),
  // and may be paginated (a space can have many collections).
  // Required permissions:
  // - read:serverless_spaces
  rpc ListSpaceAlerts(ListSpaceAlertsRequest) returns (ListSpaceAlertsResponse) {
    // permissions
    option (common.v1.permissions) = "read:serverless_spaces";
    // gRPC Gateway REST call
    option (google.api.http) = {get: "/api/serverless/v1/accounts/{account_id}/spaces/{space_id}/alerts"};
    // log fields
    option (common.v1.log_fields) = {
      name: "space_id"
      field_expression: "space_id"
    };
  }
}

// GetSpaceSummaryMetricsRequest is the request for the GetSpaceSummaryMetrics function.
message GetSpaceSummaryMetricsRequest {
  // The identifier of the account (in GUID format).
  // This is a required field.
  string account_id = 1 [(buf.validate.field).string = {uuid: true}];
  // The identifier for the space (in GUID format).
  // This space should be part of the provided account.
  // This is a required field.
  string space_id = 2 [(buf.validate.field).string = {uuid: true}];
  // Optional filter on collection names. At most one variant may be set.
  // If omitted, metrics for collections in the space are returned (paginated when page_size is set).
  oneof collection_filter {
    // Exact collection name. Returns metrics for that collection only.
    string collection_name = 3 [(buf.validate.field).string = {
      min_len: 1
      max_len: 255
      pattern: "^[a-zA-Z0-9-_.]+$"
    }];
    // Case-insensitive substring matched against collection names.
    // Returns metrics for every collection whose name contains this value.
    string collection_name_contains = 4 [(buf.validate.field).string = {
      min_len: 1
      max_len: 255
      pattern: "^[a-zA-Z0-9-_.]+$"
    }];
  }
  // Maximum number of collection metrics to return.
  // If not specified, all matching items are returned.
  optional int32 page_size = 20 [(buf.validate.field).int32 = {
    gt: 0
    lte: 250
  }];
  // A page token, received from a previous call.
  // Provide this to retrieve the subsequent page.
  // When paginating, all other parameters provided to the request must match
  // the call that provided the page token.
  optional string page_token = 21 [(buf.validate.field).string.min_len = 1];
}

// GetSpaceSummaryMetricsResponse is the response from the GetSpaceSummaryMetrics function.
message GetSpaceSummaryMetricsResponse {
  // List of metrics aggregated per collection in the space.
  repeated SpaceCollectionMetrics items = 1;
  // The total number of items available (useful in relation with pagination).
  // This field is fill out when pagination is used (aka in the request `page_size` was provided).
  optional int32 total_size = 10 [(buf.validate.field).int32.gte = 0];
  // A token that can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  optional string next_page_token = 11 [(buf.validate.field).string.min_len = 1];
}

// GetSpaceUsageMetricsRequest is the request for the GetSpaceUsageMetrics function.
message GetSpaceUsageMetricsRequest {
  // The identifier of the account (in GUID format).
  // This is a required field.
  string account_id = 1 [(buf.validate.field).string = {uuid: true}];
  // The identifier for the space (in GUID format).
  // This space should be part of the provided account.
  // This is a required field.
  string space_id = 2 [(buf.validate.field).string = {uuid: true}];
  // Optional start time for the metrics query.
  // If omitted, defaults to 1 hour ago.
  optional google.protobuf.Timestamp since = 3;
  // Optional end time for the metrics query.
  // If omitted, defaults to current time.
  optional google.protobuf.Timestamp until = 4;
  option (buf.validate.message).cel = {
    id: "get_space_usage_metrics.until_gt_since"
    message: "until must be after since"
    expression: "!has(this.since) || !has(this.until) || this.until > this.since"
  };
  // Aggregation function to apply to the time series data.
  // If omitted, defaults to SUM.
  optional Aggregator aggregator = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Optional filter on collection names. At most one variant may be set.
  // If omitted, metrics for collections in the space are returned (paginated when page_size is set).
  oneof collection_filter {
    // Exact collection name. Returns metrics for that collection only.
    string collection_name = 6 [(buf.validate.field).string = {
      min_len: 1
      max_len: 255
      pattern: "^[a-zA-Z0-9-_.]+$"
    }];
    // Case-insensitive substring matched against collection names.
    // Returns metrics for every collection whose name contains this value.
    string collection_name_contains = 7 [(buf.validate.field).string = {
      min_len: 1
      max_len: 255
      pattern: "^[a-zA-Z0-9-_.]+$"
    }];
  }
  // Maximum number of collection metrics to return.
  // If not specified, all matching items are returned.
  optional int32 page_size = 20 [(buf.validate.field).int32 = {
    gt: 0
    lte: 250
  }];
  // A page token, received from a previous call.
  // Provide this to retrieve the subsequent page.
  // When paginating, all other parameters provided to the request must match
  // the call that provided the page token.
  optional string page_token = 21 [(buf.validate.field).string.min_len = 1];
}

// GetSpaceUsageMetricsResponse is the response from the GetSpaceUsageMetrics function.
message GetSpaceUsageMetricsResponse {
  // Per-collection usage metrics for the space.
  repeated SpaceCollectionUsageMetrics items = 1;
  // The total number of items available (useful in relation with pagination).
  // This field is fill out when pagination is used (aka in the request `page_size` was provided).
  optional int32 total_size = 10 [(buf.validate.field).int32.gte = 0];
  // A token that can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  optional string next_page_token = 11 [(buf.validate.field).string.min_len = 1];
}

// GetSpaceInferenceMetricsRequest is the request for the GetSpaceInferenceMetrics function.
message GetSpaceInferenceMetricsRequest {
  // The identifier of the account (in GUID format).
  // This is a required field.
  string account_id = 1 [(buf.validate.field).string = {uuid: true}];
  // The identifier for the space (in GUID format).
  // This space should be part of the provided account.
  // This is a required field.
  string space_id = 2 [(buf.validate.field).string = {uuid: true}];
  // Optional start time for the inference metrics query.
  // If omitted, defaults to 7 days ago.
  optional google.protobuf.Timestamp since = 3;
  // Optional end time for the inference metrics query.
  // If omitted, defaults to current time.
  optional google.protobuf.Timestamp until = 4;
  option (buf.validate.message).cel = {
    id: "get_space_inference_metrics.until_gt_since"
    message: "until must be after since"
    expression: "!has(this.since) || !has(this.until) || this.until > this.since"
  };
  // Optional aggregation interval for histogram buckets.
  optional InferenceMetricsInterval interval = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Optional identifier for a specific inference model to filter metrics by.
  optional string inference_model_id = 6 [(buf.validate.field).string.min_len = 1];
  // Optional filter on collection names. At most one variant may be set.
  // If omitted, metrics for collections in the space are returned (paginated when page_size is set).
  oneof collection_filter {
    // Exact collection name. Returns metrics for that collection only.
    string collection_name = 7 [(buf.validate.field).string = {
      min_len: 1
      max_len: 255
      pattern: "^[a-zA-Z0-9-_.]+$"
    }];
    // Case-insensitive substring matched against collection names.
    // Returns metrics for every collection whose name contains this value.
    string collection_name_contains = 8 [(buf.validate.field).string = {
      min_len: 1
      max_len: 255
      pattern: "^[a-zA-Z0-9-_.]+$"
    }];
  }
  // Maximum number of collection metrics to return.
  // If not specified, all matching items are returned.
  optional int32 page_size = 20 [(buf.validate.field).int32 = {
    gt: 0
    lte: 250
  }];
  // A page token, received from a previous call.
  // Provide this to retrieve the subsequent page.
  // When paginating, all other parameters provided to the request must match
  // the call that provided the page token.
  optional string page_token = 21 [(buf.validate.field).string.min_len = 1];
}

// GetSpaceInferenceMetricsResponse is the response from the GetSpaceInferenceMetrics function.
message GetSpaceInferenceMetricsResponse {
  // Per-collection inference token usage metrics for the space.
  repeated SpaceCollectionInferenceMetrics items = 1;
  // The total number of items available (useful in relation with pagination).
  // This field is fill out when pagination is used (aka in the request `page_size` was provided).
  optional int32 total_size = 10 [(buf.validate.field).int32.gte = 0];
  // A token that can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  optional string next_page_token = 11 [(buf.validate.field).string.min_len = 1];
}

// SpaceCollectionInferenceMetrics groups inference metrics for a single collection.
message SpaceCollectionInferenceMetrics {
  // Name of the collection within the space.
  string collection_name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
    pattern: "^[a-zA-Z0-9-_.]+$"
  }];
  // Per-model inference token usage metrics for the collection.
  repeated SpaceInferenceModelMetrics models = 2;
}

// SpaceInferenceModelMetrics groups histogram data for a single inference model.
message SpaceInferenceModelMetrics {
  // Identifier of the inference model.
  string inference_model_id = 1 [(buf.validate.field).string.min_len = 1];
  // Aggregated histogram values for the inference model.
  repeated Metric values = 2;
}

// ListSpaceAlertsRequest is the request for the ListSpaceAlerts function.
message ListSpaceAlertsRequest {
  // The identifier of the account (in GUID format).
  // This is a required field.
  string account_id = 1 [(buf.validate.field).string = {uuid: true}];
  // The identifier for the space (in GUID format).
  // This space should be part of the provided account.
  // This is a required field.
  string space_id = 2 [(buf.validate.field).string = {uuid: true}];
  // Optional alert-state filter. If omitted (empty), alerts in ALL states are
  // returned; if set, only alerts in that state are returned.
  optional SpaceAlertState state = 3;
  // Optional filter on collection names. At most one variant may be set.
  // If omitted, alerts for collections in the space are returned (paginated when page_size is set).
  oneof collection_filter {
    // Exact collection name. Returns alerts for that collection only.
    string collection_name = 4 [(buf.validate.field).string = {
      min_len: 1
      max_len: 255
      pattern: "^[a-zA-Z0-9-_.]+$"
    }];
    // Case-insensitive substring matched against collection names.
    // Returns alerts for every collection whose name contains this value.
    string collection_name_contains = 5 [(buf.validate.field).string = {
      min_len: 1
      max_len: 255
      pattern: "^[a-zA-Z0-9-_.]+$"
    }];
  }
  // Maximum number of alerts to return.
  // If not specified, all matching items are returned.
  optional int32 page_size = 20 [(buf.validate.field).int32 = {
    gt: 0
    lte: 250
  }];
  // A page token, received from a previous call.
  // Provide this to retrieve the subsequent page.
  // When paginating, all other parameters provided to the request must match
  // the call that provided the page token.
  optional string page_token = 21 [(buf.validate.field).string.min_len = 1];
}

// ListSpaceAlertsResponse is the response from the ListSpaceAlerts function.
message ListSpaceAlertsResponse {
  // The alerts for the space, sorted by last_firing_at (descending) - most recent first.
  repeated SpaceAlert items = 1;
  // The total number of items available (useful in relation with pagination).
  // This field is fill out when pagination is used (aka in the request `page_size` was provided).
  optional int32 total_size = 10 [(buf.validate.field).int32.gte = 0];
  // A token that can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  optional string next_page_token = 11 [(buf.validate.field).string.min_len = 1];
}

// buf:lint:ignore QDRANT_CLOUD_REQUIRED_ENTITY_FIELDS
// SpaceAlert is a single alert instance for a collection in a space.
message SpaceAlert {
  // Stable identifier for this firing instance (in GUID format).
  // Re-firing a previously-resolved alert produces a new ID.
  string id = 1;
  // The category of alert.
  SpaceAlertType type = 2;
  // Severity tier, derived server-side from the alert type.
  SpaceAlertSeverity severity = 3;
  // Human-readable title (English, at most 80 characters).
  string title = 4;
  // Human-readable description (English, at most 300 characters).
  string description = 5;
  // UTC timestamp of the most recent firing observation for this instance.
  google.protobuf.Timestamp last_firing_at = 6;
  // The state of this alert. Always populated so callers can tell each row's
  // state apart when the request applies no state filter.
  SpaceAlertState state = 7;
  // Name of the collection this alert relates to.
  string collection_name = 8 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
    pattern: "^[a-zA-Z0-9-_.]+$"
  }];
}

// SpaceCollectionMetrics contains a metric overview for a single collection.
message SpaceCollectionMetrics {
  // Name of the collection within the space.
  string collection_name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
    pattern: "^[a-zA-Z0-9-_.]+$"
  }];
  // Overview of search request rates for the collection.
  SpaceMetricOverview search_requests = 2 [(buf.validate.field).required = true];
  // Overview of write (CRUD) request rates for the collection.
  SpaceMetricOverview write_requests = 3 [(buf.validate.field).required = true];
  // Overview of search latency for the collection.
  SpaceMetricOverview search_latency = 4 [(buf.validate.field).required = true];
  // Current number of vectors stored in the collection.
  uint64 vector_count = 5 [(buf.validate.field).uint64.gte = 0];
  // Current used (active) storage size of the collection, in bytes.
  // This is actual usage. Platform or customer storage ceilings are exposed
  // via space/collection quotas and are not part of this response.
  uint64 used_storage_bytes = 6 [(buf.validate.field).uint64.gte = 0];
}

// SpaceMetricOverview contains average values of a metric over predefined intervals.
message SpaceMetricOverview {
  // Average metric values calculated over various time intervals.
  repeated IntervalAverage avg = 1;
}

// IntervalAverage represents the average value of a metric over a specific time interval.
message IntervalAverage {
  // The duration of the interval.
  google.protobuf.Duration interval = 1 [(buf.validate.field).required = true];
  // Average value of the metric during the specified interval.
  double value = 2 [(buf.validate.field).double.gte = 0];
}

// SpaceCollectionUsageMetrics defines per-collection usage metrics as timeseries.
message SpaceCollectionUsageMetrics {
  // Name of the collection within the space.
  string collection_name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
    pattern: "^[a-zA-Z0-9-_.]+$"
  }];
  // Timeseries of search request rates for the collection.
  repeated Metric search_requests = 2;
  // Timeseries of write (CRUD) request rates for the collection.
  repeated Metric write_requests = 3;
  // Timeseries of search latency for the collection.
  repeated Metric search_latency = 4;
  // Timeseries of vector counts for the collection.
  repeated Metric vector_count = 5;
  // Timeseries of used (active) storage size for the collection, in bytes.
  repeated Metric used_storage_bytes = 6;
}

// A single metric data point.
message Metric {
  // Timestamp of the data point.
  google.protobuf.Timestamp timestamp = 1 [(buf.validate.field).required = true];
  // Numerical value of the metric at the given timestamp.
  double value = 2 [(buf.validate.field).double.gte = 0];
}

// Aggregator defines how metrics should be aggregated over time.
enum Aggregator {
  // Unspecified aggregation function.
  AGGREGATOR_UNSPECIFIED = 0;
  // SUM aggregation function.
  AGGREGATOR_SUM = 1;
  // AVG aggregation function.
  AGGREGATOR_AVG = 2;
  // MAX aggregation function.
  AGGREGATOR_MAX = 3;
  // MIN aggregation function.
  AGGREGATOR_MIN = 4;
}

// InferenceMetricsInterval defines the histogram bucket size for inference metrics.
enum InferenceMetricsInterval {
  // Interval is unspecified; defaults to DAY.
  INFERENCE_METRICS_INTERVAL_UNSPECIFIED = 0;
  // Buckets are aggregated per day.
  INFERENCE_METRICS_INTERVAL_DAY = 1;
  // Buckets are aggregated per week.
  INFERENCE_METRICS_INTERVAL_WEEK = 2;
  // Buckets are aggregated per month.
  INFERENCE_METRICS_INTERVAL_MONTH = 3;
}

// SpaceAlertState mirrors the backend state of a space alert. It is used both as
// the optional request-side filter AND echoed per row on the SpaceAlert response.
enum SpaceAlertState {
  // The alert state is unspecified.
  SPACE_ALERT_STATE_UNSPECIFIED = 0;
  // The alert is currently firing.
  SPACE_ALERT_STATE_FIRING = 1;
  // The alert has been resolved by the backend.
  SPACE_ALERT_STATE_RESOLVED = 2;
}

// SpaceAlertType is the category of a space alert. Mirrors the backend alert types.
enum SpaceAlertType {
  // The alert type is unspecified.
  SPACE_ALERT_TYPE_UNSPECIFIED = 0;
  // Collection storage usage is over the configured size threshold.
  SPACE_ALERT_TYPE_COLLECTION_STORAGE_OVERUTILIZED = 1;
  // The space has too many collections.
  SPACE_ALERT_TYPE_TOO_MANY_COLLECTIONS = 2;
  // A space API key is about to expire.
  SPACE_ALERT_TYPE_SPACE_API_KEY_ABOUT_TO_EXPIRE = 3;
  // The serverless space is unhealthy.
  SPACE_ALERT_TYPE_SPACE_UNHEALTHY = 4;
}

// SpaceAlertSeverity is the tier used by the UI to render badge color and announce severity to
// assistive tech. Color alone never conveys severity - clients must render the label.
enum SpaceAlertSeverity {
  // Default / fallback tier. Also what an alert type that is not yet mapped resolves to;
  // there is intentionally no separate UNKNOWN value.
  SPACE_ALERT_SEVERITY_UNSPECIFIED = 0;
  // Informational severity.
  SPACE_ALERT_SEVERITY_INFO = 1;
  // Warning severity.
  SPACE_ALERT_SEVERITY_WARNING = 2;
  // Critical severity.
  SPACE_ALERT_SEVERITY_CRITICAL = 3;
}
