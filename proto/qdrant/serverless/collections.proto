syntax = "proto3";

package qdrant.serverless;

import "buf/validate/validate.proto";

// CollectionsService manages the collections of a qdrant serverless space.
// Unlike the qdrant server API, it exposes only a simplified configuration:
// the manager turns it into concrete qdrant settings, which are never
// exposed to the tenant.
service CollectionsService {
  // Creates a collection with the given tenant-facing configuration.
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  // Deletes a collection and all of its data.
  rpc DeleteCollection(DeleteCollectionRequest) returns (DeleteCollectionResponse);
  // Returns a single collection's configuration and stats.
  rpc GetCollection(GetCollectionRequest) returns (GetCollectionResponse);
  // Lists the caller's collections.
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
}

// Distance metric used to compare dense vectors.
enum Distance {
  // Unset; a concrete metric is required.
  DISTANCE_UNSPECIFIED = 0;
  // Cosine similarity.
  COSINE = 1;
  // Euclidean (L2) distance.
  EUCLID = 2;
  // Dot product.
  DOT = 3;
  // Manhattan (L1) distance.
  MANHATTAN = 4;
}

// How much of the original vector precision may be traded for cost. The manager
// turns this into a concrete quantization / datatype choice; the tenant never
// picks scalar/product/binary quantization or its parameters directly.
enum PrecisionTier {
  // Unset: HIGH.
  PRECISION_TIER_UNSPECIFIED = 0;
  // Aggressive compression, lowest cost, approximate results.
  LOW = 1;
  // Moderate compression with a small accuracy trade-off.
  MEDIUM = 2;
  // Light compression, near-exact results.
  HIGH = 3;
  // No lossy compression: exact vectors, fully in memory. Highest cost.
  FULL = 4;
}

// Configuration of a single dense (embedding) vector.
message DenseVectorConfig {
  // Dimensionality of the embedding, e.g. 512 (CLIP), 1536, 3072.
  uint64 size = 1;
  // Distance metric used to compare vectors.
  Distance distance = 2;
  // Store several sub-vectors per point and compare with max-sim, for
  // late-interaction models (ColBERT, ColPali, ...).
  bool multivector = 3;
  // Precision/cost trade-off for this vector. Unset: HIGH.
  optional PrecisionTier precision_tier = 4;
}

// Configuration of a single sparse vector.
message SparseVectorConfig {
  // Apply the IDF modifier at query time. Enable for BM25-style models that
  // expect inverse-document-frequency weighting.
  bool use_idf = 1;
  // Precision/cost trade-off for this vector. Unset: HIGH.
  optional PrecisionTier precision_tier = 2;
}

// Full-text tokenizer, mirrors qdrant's `TokenizerType`.
enum Tokenizer {
  // Unset: WHITESPACE.
  TOKENIZER_UNSPECIFIED = 0;
  // Index every prefix of each token.
  PREFIX = 1;
  // Split on whitespace.
  WHITESPACE = 2;
  // Split on word boundaries.
  WORD = 3;
  // Language-aware tokenization.
  MULTILINGUAL = 4;
}

// Exact match on string values, e.g. `color: "red"`.
message KeywordIndex {
  // If set, enable prefix matching (`match: { "prefix": ... }`) on this field.
  // Presence of this message enables prefix matching; it has no options yet.
  optional KeywordPrefixParams prefix = 1;
  // Index every object of this array as a separate entry, e.g. `offers` for the field `offers[].price`.
  // The field must be inside the array's elements. `is_empty` on the field matches a point when one of
  // its elements lacks the field, and never a point without elements. Default: disabled.
  optional string nested = 2 [(buf.validate.field).string.min_len = 1];
}

// Prefix matching options for the keyword index. Has no options yet:
// presence of this message enables prefix matching.
message KeywordPrefixParams {}

// Exact match and/or range filters on integers, e.g. `age: 25`. Both are on
// by default; turning one off shrinks the index.
message IntegerIndex {
  // Support exact-match filters.
  optional bool lookup = 1;
  // Support range filters.
  optional bool range = 2;
  // Index every object of this array as a separate entry, e.g. `offers` for the field `offers[].price`.
  // The field must be inside the array's elements. `is_empty` on the field matches a point when one of
  // its elements lacks the field, and never a point without elements. Default: disabled.
  optional string nested = 3 [(buf.validate.field).string.min_len = 1];
}

// Range filters on floating point (and integer) numbers, e.g. `price: 99.5`.
message FloatIndex {
  // Index every object of this array as a separate entry, e.g. `offers` for the field `offers[].price`.
  // The field must be inside the array's elements. `is_empty` on the field matches a point when one of
  // its elements lacks the field, and never a point without elements. Default: disabled.
  optional string nested = 1 [(buf.validate.field).string.min_len = 1];
}

// Exact match on UUID strings; like keyword but stored compactly.
message UuidIndex {
  // Index every object of this array as a separate entry, e.g. `offers` for the field `offers[].id`.
  // The field must be inside the array's elements. `is_empty` on the field matches a point when one of
  // its elements lacks the field, and never a point without elements. Default: disabled.
  optional string nested = 1 [(buf.validate.field).string.min_len = 1];
}

// Range filters on RFC 3339 datetimes, e.g. `created_at: "2023-02-08T10:49:00Z"`.
message DatetimeIndex {
  // Index every object of this array as a separate entry, e.g. `offers` for the field `offers[].updated_at`.
  // The field must be inside the array's elements. `is_empty` on the field matches a point when one of
  // its elements lacks the field, and never a point without elements. Default: disabled.
  optional string nested = 1 [(buf.validate.field).string.min_len = 1];
}

// Tokens ignored by a full-text index. Language names match qdrant (e.g.
// "english"); predefined lists and custom tokens are merged.
message StopwordsSet {
  // Languages whose predefined stopword lists to apply.
  repeated string languages = 1;
  // Extra stopwords to ignore, merged with the language lists.
  repeated string custom = 2;
}

// Snowball stemming for a full-text index.
message SnowballParams {
  // Language for the snowball algorithm, e.g. "english".
  string language = 1;
}

// Explicitly disable stemming (overrides any language default).
message DisabledStemmer {}

// Stemming algorithm for a full-text index. Unset: no stemming.
message StemmingAlgorithm {
  // Which stemming algorithm to use.
  oneof stemming_params {
    // Snowball stemmer for the given language.
    SnowballParams snowball = 1;
    // Explicitly disable stemming.
    DisabledStemmer disabled = 2;
  }
}

// How a text index ranks documents.
enum TextScoringType {
  // Unset: BM25.
  TEXT_SCORING_TYPE_UNSPECIFIED = 0;
  // Okapi BM25. The index records each document's length; `k` and `b` are set per query.
  BM25 = 1;
}

// Parameters of ranking over a text index.
// Presence of this message enables scoring. An unset type means BM25.
// On the REST API, `true` is the same as an empty object and `false` disables scoring.
message TextScoringParams {
  // How documents are ranked. Unset: BM25.
  optional TextScoringType type = 1;
}

// Full-text filtering on string values.
message TextIndex {
  option (buf.validate.message).cel = {
    id: "text_index.token_len_window"
    message: "min_token_len can't be greater than max_token_len"
    expression: "!has(this.min_token_len) || !has(this.max_token_len) || this.min_token_len <= this.max_token_len"
  };
  // Tokenizer to split text with. Unset: WHITESPACE.
  optional Tokenizer tokenizer = 1;
  // Lowercase text before indexing. Default true.
  optional bool lowercase = 2;
  // Support phrase queries; extra index structure. Default true.
  optional bool phrase_matching = 3;
  // Minimum token length to index.
  optional uint64 min_token_len = 4;
  // Maximum token length to index.
  optional uint64 max_token_len = 5;
  // Fold accented characters to ASCII. Default false.
  optional bool ascii_folding = 6;
  // Tokens to ignore at index and query time.
  optional StopwordsSet stopwords = 7;
  // Stemming algorithm. Unset: engine default (no stemming).
  optional StemmingAlgorithm stemmer = 8;
  // Enable ranking points by BM25 over this field.
  // Changing it rebuilds the index. Default: disabled.
  optional TextScoringParams scoring = 9;
  // Index every object of this array as a separate entry, e.g. `offers` for the field `offers[].title`.
  // The field must be inside the array's elements. Every query on the field, not only nested filters,
  // treats each element as its own document: a condition matches a point when a single element
  // matches it, and BM25 scores elements separately. `is_empty` on the field matches a point when
  // one of its elements lacks the field, and never a point without elements. Default: disabled.
  optional string nested = 10 [(buf.validate.field).string.min_len = 1];
}

// Geo radius / bounding box / polygon filters on `{lon, lat}` values.
message GeoIndex {
  // Index every object of this array as a separate entry, e.g. `offers` for the field `offers[].location`.
  // The field must be inside the array's elements. `is_empty` on the field matches a point when one of
  // its elements lacks the field, and never a point without elements. Default: disabled.
  optional string nested = 1 [(buf.validate.field).string.min_len = 1];
}

// Exact match on booleans, e.g. `is_active: true`.
message BoolIndex {
  // Index every object of this array as a separate entry, e.g. `offers` for the field `offers[].in_stock`.
  // The field must be inside the array's elements. `is_empty` on the field matches a point when one of
  // its elements lacks the field, and never a point without elements. Default: disabled.
  optional string nested = 1 [(buf.validate.field).string.min_len = 1];
}

// One payload index. Only the *kind* of filter the field supports is chosen
// here; storage placement of the index is the manager's decision.
message PayloadIndexConfig {
  // The kind of filter the field supports.
  oneof index {
    // Exact match on strings.
    KeywordIndex keyword = 1;
    // Exact match and/or range filters on integers.
    IntegerIndex integer = 2;
    // Range filters on numbers.
    FloatIndex float = 3;
    // Exact match on UUIDs.
    UuidIndex uuid = 4;
    // Range filters on datetimes.
    DatetimeIndex datetime = 5;
    // Full-text filtering.
    TextIndex text = 6;
    // Geo filters.
    GeoIndex geo = 7;
    // Exact match on booleans.
    BoolIndex bool = 8;
  }
}

// The tenant's collection config. Persisted verbatim. At least one dense or
// sparse vector is required.
message CollectionConfig {
  // Keyed by vector name. The empty name "" is the unnamed default vector, as
  // in qdrant; a collection either has the single unnamed vector or named ones.
  map<string, DenseVectorConfig> dense_vectors = 1;
  // Keyed by vector name.
  map<string, SparseVectorConfig> sparse_vectors = 2;
  // Keyed by payload field name (JSON path, e.g. `user_id` or `meta.tags`).
  map<string, PayloadIndexConfig> payload_indexes = 3;
}

// Every request names the collection by its tenant-facing name only. The
// tenant (`x-account-id`, `x-space-id`) travels in gRPC metadata, injected by
// auth. The storage id is the manager's: minted on create, resolved
// internally on get/delete.
message CreateCollectionRequest {
  // Tenant-facing name of the collection to create.
  string collection_name = 1;
  // The collection's configuration.
  CollectionConfig config = 2;
}

// Result of a create.
message CreateCollectionResponse {
  // Tenant-facing name of the collection.
  string collection_name = 1;
  // Outcome, e.g. "created", "already exists".
  string result = 2;
  // Time spent to process
  double time = 3;
}

// Names the collection to delete.
message DeleteCollectionRequest {
  // Tenant-facing name of the collection to delete.
  string collection_name = 1;
}

// Result of a delete.
message DeleteCollectionResponse {
  // Whether the collection existed and was deleted.
  bool deleted = 1;
  // Time spent to process
  double time = 2;
}

// Names the collection to fetch.
message GetCollectionRequest {
  // Tenant-facing name of the collection.
  string collection_name = 1;
}

// The collection's configuration and stats, if it exists.
message GetCollectionResponse {
  // Whether the collection exists.
  bool exists = 1;
  // The configuration the collection was created with.
  optional CollectionConfig config = 2;
  // Available points as of the last applied write (eventually consistent);
  // absent until the updater has written stats for the collection.
  optional uint64 point_count = 3;
  // Time spent to process
  double time = 4;
}

// Lists the caller's collections. The tenant travels in metadata.
message ListCollectionsRequest {
  // Maximum number of collections to return. Defaults to 20 and must not
  // exceed 100.
  optional uint32 limit = 1 [(buf.validate.field).uint32 = {
    gt: 0
    lte: 100
  }];
  // Opaque token returned as `next_offset_token` by the previous page. Clients
  // must not interpret this value.
  optional string offset_token = 2;
}

// One collection in a listing.
message CollectionSummary {
  // Tenant-facing name of the collection.
  string collection_name = 1;
  // Available points as of the last applied write (eventually consistent);
  // absent until the updater has written stats for the collection.
  optional uint64 point_count = 2;
}

// The caller's collections.
message ListCollectionsResponse {
  // Collections in this page.
  repeated CollectionSummary collections = 1;
  // Opaque token to pass as `offset_token` to retrieve the next page. Absent
  // when there are no more results.
  optional string next_offset_token = 2;
  // Time spent to process
  double time = 3;
}
