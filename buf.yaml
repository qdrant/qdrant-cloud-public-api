# For details on buf.yaml configuration, visit https://buf.build/docs/configuration/v2/buf-yaml
version: v2
modules:
  - path: proto
    name: github.com/qdrant/qdrant-cloud-public-api
deps:
  - buf.build/googleapis/googleapis
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
    - COMMENTS
    - QDRANT_CLOUD_METHOD_OPTIONS
    - QDRANT_CLOUD_REQUIRED_ENTITY_FIELDS
    - QDRANT_CLOUD_REQUIRED_REQUEST_FIELDS
  # qdrant/serverless is the app-facing (data-plane) API of qdrant serverless
  # spaces, served by the serverless deployment itself, not the cloud API
  # gateway: auth is a space API key and the tenant travels in gRPC metadata,
  # so the cloud permissions/account_id/http-annotation conventions don't
  # apply. Naming follows the qdrant server API it sits next to.
  ignore_only:
    PACKAGE_VERSION_SUFFIX:
      - proto/qdrant/serverless
    ENUM_VALUE_PREFIX:
      - proto/qdrant/serverless
    ENUM_ZERO_VALUE_SUFFIX:
      - proto/qdrant/serverless
    QDRANT_CLOUD_METHOD_OPTIONS:
      - proto/qdrant/serverless
    QDRANT_CLOUD_REQUIRED_ENTITY_FIELDS:
      - proto/qdrant/serverless
    QDRANT_CLOUD_REQUIRED_REQUEST_FIELDS:
      - proto/qdrant/serverless
breaking:
  use:
    - FILE
    - QDRANT_CLOUD_PERMISSIONS_BREAKING
plugins:
  - plugin: buf-plugin-method-options
  - plugin: buf-plugin-required-fields
  - plugin: buf-plugin-permissions-breaking
